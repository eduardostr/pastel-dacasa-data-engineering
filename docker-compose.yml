name: pastel-da-casa-crm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pastelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente ou em .env}
      POSTGRES_DB: ${POSTGRES_DB:-pastelflow_oltp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/oltp/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/oltp/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
    external: true
    name: pastelflow-crm_postgres_data
